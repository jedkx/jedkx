name: Refresh profile assets
on:
  schedule:
    - cron: '17 * * * *' # hourly: recent pushes stay fresh (commits only when something changed)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['data/profile.json', 'scripts/**', 'art/**', 'vendor/**', '.github/workflows/update-profile.yml']
permissions:
  contents: write
concurrency:
  group: profile-assets
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Fetch real public repository data
        run: node scripts/sync-github.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Generate contribution snake
        run: node scripts/generate-snake.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Render profile and project cards
        run: node scripts/render-assets.mjs
      - name: Check generated assets
        run: node scripts/check.mjs
      - name: Save successful update
        run: |
          git add README.md assets data/repositories.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh profile assets [skip ci]'
          git push origin HEAD:main
